<!doctype html><meta charset="utf-8"><title>b9</title>
<link rel="stylesheet" href="card.css">
<style>
.center { position: absolute; left: 120px; right: 120px; top: 250px; }
.big { font-size: 170px; font-weight: 600; letter-spacing: -0.045em; line-height: 0.95; }
.big span { color: var(--signal); }
.facts { display: flex; gap: 22px; margin-top: 44px; flex-wrap: wrap; }
.f { font-family: var(--mono); font-size: 28px; padding: 12px 22px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--paper-raise); }
.f.url { background: var(--signal); color: #fff; border-color: var(--signal); }
.tag { font-size: 70px; font-weight: 500; letter-spacing: -0.035em; margin-top: 80px; padding-top: 34px;
  border-top: 2px solid var(--ink); max-width: 1500px; }
.tag em { font-style: normal; color: var(--signal); }
</style>
<div class="stage">
  <div class="top"><div class="brand">HealthClaw<span>2.0</span></div><div class="kind">slide · 9 / 9</div></div>
  <div class="center">
    <div class="big fx" id="b">HealthClaw <span>2.0</span></div>
    <div class="facts">
      <span class="f fx" id="f1">free</span>
      <span class="f fx" id="f2">anyone can read the code</span>
      <span class="f url fx" id="f3">healthclaw.io</span>
    </div>
    <div class="tag fx" id="t">The AI helps. <em>You stay in charge.</em></div>
  </div>
</div>
<script src="anim.js"></script>
<script>
window.render = (t) => {
  push(t, 0.035);
  fade($('#b'), t, 0.1, 0.7, 20);
  fade($('#f1'), t, 1.0, 0.4, 10); fade($('#f2'), t, 2.3, 0.4, 10);
  fade($('#f3'), t, cue('s2', 4.5), 0.45, 10);
  fade($('#t'), t, cue('s3', 7.7), 0.6, 16);
};
</script>
