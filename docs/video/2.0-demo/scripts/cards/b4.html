<!doctype html><meta charset="utf-8"><title>b4</title>
<link rel="stylesheet" href="card.css">
<style>
h1 { font-size: 66px; max-width: 36ch; margin-top: 12px; }
.eyebrow b { font-weight: 400; color: var(--signal); }
.tbl { margin-top: 30px; display: grid; grid-template-columns: 300px 1fr 90px 1fr; }
.hd { font-family: var(--mono); font-size: 20px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-faint); padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.hd small { display: block; text-transform: none; letter-spacing: 0; font-size: 17px; margin-top: 6px; }
.hd.r { color: var(--signal); }
.c { padding: 15px 0; border-bottom: 1px solid var(--rule); font-size: 36px; letter-spacing: -0.01em;
  display: flex; align-items: baseline; gap: 18px; min-height: 74px; }
.c.k { font-family: var(--mono); font-size: 22px; color: var(--ink-soft); letter-spacing: .02em; align-items: center; }
.c.k:has(.via) { flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; }
.via { font-size: 16px; color: var(--ink-faint); letter-spacing: 0; line-height: 1.3; }
.c.a { justify-content: center; color: #B9B4A8; font-size: 30px; align-items: center; }
.c.out { color: var(--signal); font-weight: 600; }
.c.out.kept { color: var(--ink); }
.c .note { font-family: var(--mono); font-size: 18px; font-weight: 400; color: var(--ink-faint);
  border: 1px solid var(--rule); padding: 3px 10px; border-radius: 3px; }
.c.out.kept .note { color: var(--pass); border-color: var(--pass); background: var(--pass-wash); }
.c .pend { color: #CFCABF; font-weight: 400; }
.mono { font-family: var(--mono); }
</style>
<div class="stage">
  <div class="top"><div class="brand">HealthClaw<span>2.0</span></div><div class="kind"><b>captured</b> · 4 / 9</div></div>
  <div class="eyebrow fx" id="eb">PROMISE ONE · <b>CAPTURED FROM A REAL RUN</b> · SYNTHETIC DEMO PATIENT</div>
  <h1 class="fx" id="h">Health facts go through. <em>Contact details don't.</em></h1>
  <div class="tbl" id="tbl">
    <div class="hd fx hdr">&nbsp;</div>
    <div class="hd fx hdr">Stored in the record<small>database row, read directly</small></div>
    <div class="hd fx hdr">&nbsp;</div>
    <div class="hd r fx hdr">What the AI gets<small id="req">API response</small></div>
  </div>
  <div class="foot"><span class="fx" id="ft"></span><span>healthclaw.io</span></div>
</div>
<script src="anim.js"></script>
<script>
const NOTES = { 'Test result': 'kept', 'Name': 'initials', 'Phone': 'removed',
                'Address': 'state only', 'Birth date': 'year only' };
const ORDER = ['Test result', 'Name', 'Phone', 'Address', 'Birth date'];
window.init = () => {
  const d = window.DATA.b4;
  const rows = Object.fromEntries(d.rows.map((r) => [r.label, r]));
  const q = (o) => `A1c ${o.valueQuantity.value} ${o.valueQuantity.unit}`;
  rows['Test result'] = { label: 'Test result', stored: q(d.stored_a1c), returned: q(d.returned_a1c) };
  const tbl = document.getElementById('tbl');
  ORDER.forEach((k, i) => {
    const r = rows[k];
    const kept = k === 'Test result';
    tbl.insertAdjacentHTML('beforeend',
      `<div class="c k fx rw${i}">${k}${kept ? '<small class="via">via GET Observation?patient=<br>Patient/demo-patient-rivera<br>entry demo-obs-a1c</small>' : ''}</div>` +
      `<div class="c fx rw${i}">${r.stored}</div>` +
      `<div class="c a fx rw${i}">&rarr;</div>` +
      `<div class="c out ${kept ? 'kept' : ''} fx rw${i}" id="o${i}"><span class="pend">&hellip;</span></div>`);
    document.getElementById('o' + i).dataset.v = r.returned;
    document.getElementById('o' + i).dataset.n = NOTES[k];
  });
  document.getElementById('req').textContent = `GET /r6/fhir/Patient/${d.patient_id} → ${d.api_status}`;
  document.getElementById('ft').textContent =
    `Captured ${d.captured_at.slice(0, 16)} UTC · local engine · tenant ${d.tenant} · rows generated from the run, not typed`;
};
window.render = (t) => {
  push(t, 0.025);
  fade($('#eb'), t, 0.05); fade($('#h'), t, 0.15, 0.6);
  $$('.hdr').forEach((e) => fade(e, t, 0.5, 0.4, 0));
  ORDER.forEach((k, i) => $$('.rw' + i).forEach((e) => fade(e, t, 0.8 + i * 0.12, 0.4, 8)));
  fade($('#ft'), t, 1.2, 0.5, 0);
  const at = [cue('facts', 1.7), cue('name', 5.2), cue('contact', 7.3), cue('contact', 7.3) + 0.55, cue('contact', 7.3) + 1.1];
  ORDER.forEach((k, i) => {
    const o = document.getElementById('o' + i);
    const on = t >= at[i];
    const want = on ? `<span class="v">${o.dataset.v}</span><span class="note">${o.dataset.n}</span>` : '<span class="pend">&hellip;</span>';
    if (o.innerHTML !== want) o.innerHTML = want;
    const v = o.querySelector('.v');
    if (v) { const k2 = ramp(t, at[i], 0.35); v.style.opacity = k2; o.querySelector('.note').style.opacity = k2; }
  });
};
</script>
