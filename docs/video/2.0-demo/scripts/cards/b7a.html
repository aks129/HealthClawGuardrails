<!doctype html><meta charset="utf-8"><title>b7a</title>
<link rel="stylesheet" href="card.css">
<style>
h1 { font-size: 66px; margin-top: 12px; max-width: none; }
.eyebrow b { font-weight: 400; color: var(--signal); }
.cols { display: grid; grid-template-columns: 300px 520px 1fr; gap: 56px; margin-top: 46px; align-items: start; }
.grade { border: 4px solid var(--pass); background: var(--pass-wash); border-radius: 4px; text-align: center; padding: 20px 0 26px; }
.grade .g { font-size: 200px; font-weight: 700; line-height: 1; color: var(--pass); letter-spacing: -0.04em; }
.grade .s { font-family: var(--mono); font-size: 22px; color: var(--pass); margin-top: 6px; }
.props { display: flex; flex-direction: column; }
.pr { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 29px; }
.pr span:last-child { font-family: var(--mono); font-size: 22px; color: var(--pass); }
.tests { font-family: var(--mono); font-size: 20px; background: #14140F; color: #EDEBE4; border-radius: 4px; padding: 26px 30px; line-height: 1.75; }
.tests .p { color: #7FD4A4; }
.tests .d { color: #9C9A90; }
</style>
<div class="stage">
  <div class="top"><div class="brand">HealthClaw<span>2.0</span></div><div class="kind"><b>captured</b> · 7 / 9</div></div>
  <div class="eyebrow fx" id="eb">CHECKED AUTOMATICALLY · <b>CAPTURED FROM A REAL RUN</b></div>
  <h1 class="fx" id="h">Automatic tests check the promises.</h1>
  <div class="cols">
    <div class="grade fx" id="gr"><div class="g" id="g"></div><div class="s" id="gs"></div></div>
    <div class="props" id="props"></div>
    <div class="tests fx" id="tests"></div>
  </div>
  <div class="foot"><span>Grade: conformance self-test (GET /r6/fhir/$conformance, in-process test client) · tests: pytest @ 76fff1d</span><span>healthclaw.io</span></div>
</div>
<script src="anim.js"></script>
<script>
window.init = () => {
  const txt = window.DATA.conformance;
  const m = txt.match(/Grade:\s+(\S+)\s+\((\d+\/\d+) properties\)/);
  document.getElementById('g').textContent = m[1];
  document.getElementById('gs').textContent = `${m[2]} properties`;
  const props = [...txt.matchAll(/^\s+\[(PASS|FAIL)\] ([^\n—]+?)(?: —.*)?$/gm)];
  document.getElementById('props').innerHTML = props.map((p, i) =>
    `<div class="pr fx pp${i}"><span>${p[2].trim()}</span><span>${p[1]}</span></div>`).join('');
  window.NPROPS = props.length;
  const lines = window.DATA.pytest.trim().split('\n');
  let html = '';
  for (let i = 0; i < lines.length; i += 2)
    html += `<span class="d">$ pytest ${lines[i].replace('== ', '')} -q</span><br><span class="p">${lines[i + 1].replace(/ in [0-9.]+s/, '')}</span><br>`;
  document.getElementById('tests').innerHTML = html;
};
window.render = (t) => {
  push(t, 0.03);
  fade($('#eb'), t, 0.05); fade($('#h'), t, 0.15, 0.5);
  fade($('#gr'), t, 0.5, 0.45, 14);
  for (let i = 0; i < window.NPROPS; i++) fade($('.pp' + i), t, 0.8 + i * 0.16, 0.35, 8);
  fade($('#tests'), t, 1.9, 0.45, 12);
};
</script>
