name: prod-watch

# Scheduled verification that the live product works. There was none before:
# the sign-in code input silently truncated 8-digit codes to 6 (#181) and UI
# login was broken in production until a human noticed.
#
# On failure this opens (or updates) a single pinned issue rather than emailing
# a red X into a folder nobody reads — that is the channel a solo maintainer
# actually sees. On recovery it closes the issue with a note, so a stale alarm
# never sits open pretending production is still down.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h, off the hour to dodge runner crowds
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `git log --since` needs history. The default shallow clone returns
          # exactly one commit, which would silently narrow the accepted set to
          # the tip and fail every deploy that is legitimately in flight.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check production
        id: watch
        run: |
          set +e
          # Accepted builds: the tip, plus everything merged to main in the
          # last 24h. A deploy still rolling out matches an hours-old commit
          # and passes; a months-old build matches nothing.
          TIP="$(git rev-parse origin/main 2>/dev/null)"
          # Fail loudly rather than passing a malformed set, which would raise
          # a stale-build alarm about a build that is perfectly current.
          case "$TIP" in *[!0-9a-f]*|"") echo "cannot resolve origin/main"; exit 1;; esac
          EXPECT="--expect-sha $TIP"
          for sha in $(git log --since=24.hours --format=%H origin/main); do
            EXPECT="$EXPECT --expect-sha $sha"
          done
          uv run --with requests python scripts/prod_watch.py $EXPECT > result.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          # Strip ANSI so the issue body is readable.
          sed -i 's/\x1b\[[0-9;]*m//g' result.txt
          cat result.txt

      - name: Sync the alert issues
        uses: actions/github-script@v7
        env:
          EXIT: ${{ steps.watch.outputs.exit }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('result.txt', 'utf8').trim();
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const exit = process.env.EXIT;
            // Two alarms on purpose. An outage and a stale build have different
            // urgency and different remedies, and a stale build holding the
            // outage issue open would destroy the meaning of the outage issue.
            const alarms = [
              ['prod-watch: production checks failing', exit === '1',
               'Scheduled production check failed.'],
              ['prod-watch: deployed build is stale', exit === '2',
               'Production is healthy, but it is not running the build we expect.'],
            ];
            for (const [title, firing, lead] of alarms) {
              const { data: found } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              });
              // Search is fuzzy and the two titles share words — match exactly.
              const open = found.items.filter(i => i.title === title);
              if (firing) {
                const text = [lead, '', '```', body, '```', '', `Run: ${run}`, '',
                  'This issue closes automatically when the check passes again.'].join('\n');
                if (open.length) {
                  await github.rest.issues.createComment({
                    ...context.repo, issue_number: open[0].number, body: text });
                } else {
                  await github.rest.issues.create({ ...context.repo, title, body: text });
                }
              } else {
                for (const issue of open) {
                  await github.rest.issues.createComment({
                    ...context.repo, issue_number: issue.number,
                    body: `This check is passing again. Closing.\n\nRun: ${run}` });
                  await github.rest.issues.update({
                    ...context.repo, issue_number: issue.number, state: 'closed' });
                }
              }
            }

      - name: Fail the run so the badge reflects reality
        if: steps.watch.outputs.exit != '0'
        run: exit 1
