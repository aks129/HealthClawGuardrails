# PR risk rubric, read by scripts/pr_risk.py.
#
# SHADOW MODE. The pr-risk workflow labels and comments from this file. It
# arms nothing, blocks nothing and merges nothing.
#
# risk = max(path floor, diff signals). A changed path takes the highest level
# of every rule it matches, so a narrow R3 rule beats a broad R0 one with no
# exclusion syntax. A path no rule matches is R1: unknown is not zero.
#
# The workflow reads this file and the scorer from the DEFAULT branch, never
# from the pull request, so a PR cannot change the rules it is scored by.
# Editing either one is itself R3.
#
# Globs: `**` crosses directories, `*` and `?` do not. Patterns are whole
# repo-relative paths.

default_level: 1

paths:
  # R0: prose and tests. A deleted or skipped test is caught by a signal.
  - {level: 0, glob: "docs/**"}
  - {level: 0, glob: "*.md"}
  - {level: 0, glob: "**/*.md"}
  - {level: 0, glob: "tests/**"}

  # R1: UI, copy, non-CI scripts. Also the default for anything unlisted.
  - {level: 1, glob: "docs/qa/**"}
  - {level: 1, glob: "docs/specs/**"}
  - {level: 1, glob: "careagents/templates/**"}
  - {level: 1, glob: "careagents/static/**"}
  - {level: 1, glob: "templates/**"}
  - {level: 1, glob: "static/**"}
  - {level: 1, glob: "scripts/**"}

  # R2: application logic, CI, dependencies, schema, container config.
  - {level: 2, glob: "r6/**"}
  - {level: 2, glob: "careagents/**/*.py"}
  - {level: 2, glob: "services/agent-orchestrator/**"}
  - {level: 2, glob: "migrations/**"}
  - {level: 2, glob: "r6/database_migrations.py"}
  - {level: 2, glob: ".github/**"}
  - {level: 2, glob: "pyproject.toml"}
  - {level: 2, glob: "uv.lock"}
  - {level: 2, glob: "**/package.json"}
  - {level: 2, glob: "**/package-lock.json"}
  - {level: 2, glob: "package.json"}
  - {level: 2, glob: "Dockerfile"}
  - {level: 2, glob: "**/Dockerfile*"}
  - {level: 2, glob: "railway.toml"}
  - {level: 2, glob: "**/railway.*"}
  - {level: 2, glob: "vercel.json"}
  - {level: 2, glob: "docker-compose.yml"}
  - {level: 2, glob: "deploy/**"}
  - {level: 2, glob: "tests/test_ci_hardening.py"}
  - {level: 2, glob: "tests/test_pr_review_notifications.py"}

  # R3: the guardrails themselves. Redaction, audit, step-up and access,
  # auth, tenancy, writes and the action rail, terminology labels, secrets
  # and env handling, deploy workflows, the review standards, and this
  # rubric and its scorer.
  - {level: 3, glob: "r6/access.py"}
  - {level: 3, glob: "r6/redaction.py"}
  - {level: 3, glob: "**/*redact*"}
  - {level: 3, glob: "r6/audit.py"}
  - {level: 3, glob: "r6/audit_ddl.py"}
  - {level: 3, glob: "**/*audit*.py"}
  - {level: 3, glob: "r6/health_compliance.py"}
  - {level: 3, glob: "r6/stepup.py"}
  - {level: 3, glob: "r6/oauth.py"}
  - {level: 3, glob: "r6/read_auth.py"}
  - {level: 3, glob: "r6/internal_auth.py"}
  - {level: 3, glob: "r6/constant_time.py"}
  - {level: 3, glob: "r6/body_guard.py"}
  - {level: 3, glob: "r6/routes.py"}
  - {level: 3, glob: "r6/fhir_proxy.py"}
  - {level: 3, glob: "r6/safe_read.py"}
  - {level: 3, glob: "r6/purge.py"}
  - {level: 3, glob: "r6/resource_ids.py"}
  - {level: 3, glob: "r6/actions/**"}
  - {level: 3, glob: "r6/terminology.py"}
  - {level: 3, glob: "r6/terminology_resolver.py"}
  - {level: 3, glob: "r6/runtime_config.py"}
  - {level: 3, glob: "careagents/accounts.py"}
  - {level: 3, glob: "careagents/consent.py"}
  - {level: 3, glob: "careagents/config.py"}
  - {level: 3, glob: "careagents/security_headers.py"}
  - {level: 3, glob: "services/agent-orchestrator/src/**/*auth*"}
  - {level: 3, glob: ".env*"}
  - {level: 3, glob: "**/.env*"}
  - {level: 3, glob: ".gitleaksignore"}
  - {level: 3, glob: ".github/workflows/publish.yml"}
  - {level: 3, glob: ".github/workflows/claude-pr-review.yml"}
  - {level: 3, glob: ".github/workflows/pr-risk.yml"}
  - {level: 3, glob: ".github/REVIEW_STANDARDS.md"}
  - {level: 3, glob: ".github/CODEOWNERS"}
  - {level: 3, glob: "CODEOWNERS"}
  - {level: 3, glob: "docs/defect-catalogue.md"}
  - {level: 3, glob: ".github/pr-risk.yml"}
  - {level: 3, glob: "scripts/pr_risk.py"}
  - {level: 3, glob: "tests/test_pr_risk.py"}
  - {level: 3, glob: "tests/test_guardrail_conformance.py"}

# Diff signals. The detectors are code in scripts/pr_risk.py; this table sets
# the level each one raises a PR to. A signal missing here is an error, not a
# zero, so a detector cannot be switched off by deleting its row.
signals:
  step_up_truthiness: 3   # validate_step_up_token not destructured into (ok, reason)
  tenant_filter_removed: 3  # a tenant_id filter line deleted and not re-added
  human_confirmed_header: 3  # X-Human-Confirmed added anywhere outside prose (#214)
  new_write_route: 3      # a new POST/PUT/PATCH/DELETE route
  new_env_secret: 3       # a newly read env var or Actions secret named like a secret
  display_text_touched: 2  # application code reads "display" or "text"
  test_deleted: 2         # a test file deleted, or a test function removed
  test_skipped: 2         # skip/xfail/noqa added
